# The `l1d2d_probe/` directory holds diagnostic IR scaffold cells, NOT
# runnable lit tests. Each `cell_D*.mlir` file is hand-written `metal.kernel`
# IR used during the L1d2d session to probe specific behaviors (barrier
# absence, in-warp staging, mask interactions, etc.) — they have no `RUN:`
# line on purpose. Excluding them from lit discovery avoids spurious
# UNRESOLVED entries that block CI (see metal-backend-ci.yml lit step).
#
# If a future change converts any of these into a real test, give it a
# `// RUN:` line AND move it out of this directory so lit picks it up
# again under the parent `test/Dialect/Metal/` discovery.
config.suffixes = []
