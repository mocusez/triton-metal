[workspace]
authors = ["triton-metal contributors"]
channels = ["conda-forge"]
name = "triton-dev"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
cmake = ">=3.20,<4"
ninja = ">=1.11"
# Upstream switched the Python bindings from pybind11 to nanobind (#10283);
# the version is pinned to match python/requirements.txt exactly.
nanobind = "==2.10.2"
setuptools = ">=40.8"
wheel = "*"
pip = "*"
lit = "*"
# runtime/test
numpy = "*"
pytest = "*"
# torch is needed for the standard Triton launch protocol
# (`add_kernel[grid](x, y, out, ...)` with real tensors). See
# the implementation notes.
pytorch = "*"
# matplotlib + pandas are needed for `triton.testing.perf_report`'s
# `Mark._run` (`plt.savefig` + DataFrame). Without them, the
# `test_perf_report_smoke` test in `test_metal_perf_report.py` fails on
# import.
matplotlib = "*"
pandas = "*"
# Keep native-source formatting reproducible inside the project environment.
clang-format = ">=23.1.0,<24"

[tasks]
# Build Triton (editable) against the pixi-managed Python; uses Triton's own
# bundled LLVM download path triggered by setup.py.
install = "pip install -e . --no-build-isolation -v"

# Dump TTGIR for the upstream vector_add tutorial. The kernel may abort at
# launch time (no GPU) — that's fine; we only need make_ttgir to run before
# the abort. TRITON_BACKENDS_IN_TREE=1 forces the in-tree backend walker so
# our stub metal backend is picked up even without entry-point install.
dump-ttgir = { cmd = "rm -rf /tmp/triton-dump && mkdir -p /tmp/triton-dump && TRITON_BACKENDS_IN_TREE=1 TRITON_KERNEL_DUMP=1 TRITON_DUMP_DIR=/tmp/triton-dump TRITON_ALWAYS_COMPILE=1 python python/tutorials/01-vector-add.py || true", depends-on = ["install"] }

# Verify the dumped TTGIR contains the expected op-name set.
check-ttgir = { cmd = "python python/test/unit/tools/check_ttgir_shape.py /tmp/triton-dump", depends-on = ["dump-ttgir"] }

# Full acceptance gate.
verify = { depends-on = ["check-ttgir"] }

# Runnable Metal Leet fixtures (each has an `if __name__ == "__main__"` driver
# that picks MPS / CUDA, builds inputs, calls `solve`, and asserts against a
# PyTorch reference).
leet-leaky-relu = "python python/test/unit/fixtures/metal_leet/easy-leaky_Relu.py"
leet-color-inversion = "python python/test/unit/fixtures/metal_leet/easy-color_inversion.py"
leet-1d-convolution = "python python/test/unit/fixtures/metal_leet/easy-1D_convolution.py"
leet-geglu = "python python/test/unit/fixtures/metal_leet/easy-gaussian_error_gated_linear_unit.py"
leet-interleave-arrays = "python python/test/unit/fixtures/metal_leet/easy-interleave_arrays.py"
leet-matrix-transpose = "python python/test/unit/fixtures/metal_leet/easy-matrix_transpose.py"
leet-2d-convolution = "python python/test/unit/fixtures/metal_leet/medium-2d_convolution.py"
leet-2d-fft = "python python/test/unit/fixtures/metal_leet/medium-2d_fft.py"
leet-3d-convolution = "python python/test/unit/fixtures/metal_leet/medium-3D_convolution.py"
leet-2d-subarray-sum = "python python/test/unit/fixtures/metal_leet/medium-2D_subarray_sum.py"
leet-3d-subarray-sum = "python python/test/unit/fixtures/metal_leet/medium-3D_subarray_sum.py"
leet-mse = "python python/test/unit/fixtures/metal_leet/medium-mean_squared_error.py"
leet-ordinary-least-squares = "python python/test/unit/fixtures/metal_leet/medium-ordinary_least_squares.py"
leet-stream-compaction = "python python/test/unit/fixtures/metal_leet/medium-stream-compaction.py"
leet-subarray-sum = "python python/test/unit/fixtures/metal_leet/medium-subarray_sum.py"
leet-sparse-matvec = "python python/test/unit/fixtures/metal_leet/medium-sparse_matrix-vector_multiplication.py"
leet-sparse-dense-matmul = "python python/test/unit/fixtures/metal_leet/medium-sparse_matrix-Dense_matrix_multiplication.py"
leet-jacobi-stencil = "python python/test/unit/fixtures/metal_leet/medium-2d_jacobi_stencil.py"
leet-adder-transformer = "python python/test/unit/fixtures/metal_leet/medium-adder_transformer_inference.py"
leet-grouped-query-attention = "python python/test/unit/fixtures/metal_leet/medium-grouped-query-attention.py"
leet-vector-add-smoke = "python python/test/unit/fixtures/metal_leet/test-1.py"
leet-tutorial-vector-add = "python python/test/unit/fixtures/metal_leet/tutorials_python/01-vector-add.py"
leet-tutorial-fused-softmax = "python python/test/unit/fixtures/metal_leet/tutorials_python/02-fused-softmax.py"

# Audit all 90 Metal Leet Python fixtures and cover every runnable workload
# through its owned pytest or standalone path.
leet-all = "python python/test/unit/test_metal_backend_leet_uncovered.py --all"
